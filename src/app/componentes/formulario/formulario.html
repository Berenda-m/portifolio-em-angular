
<h1>Teste de produtos</h1>
<form (submit)="cadastrarProduto($event)">
   <!--Titulo-->
   <input type="text" [formField]="produtoForm.titulo" placeholder="Nome do produto">

   <!--Descrição-->
   <input type="text" [formField]="produtoForm.descricao" placeholder="Descricao do produto">

   <!--Preço-->
   <input type="text" inputmode="decimal" [formField]="produtoForm.preco" placeholder="Valor do produto">


   <button>Cadastrar produto</button>


</form> 
@for (produto of formularioService.produtos(); track $index) {
<div class="card-produto">
   <p><i class="fa-solid fa-cart-shopping"></i>  {{produto.titulo}}</p>
   <p><i class="fa-solid fa-list"></i>  {{produto.descricao}}</p>
   <p><i class="fa-solid fa-money-bill-1"></i>  {{produto.preco}}</p>

</div>
}
