<form (submit)="cadastrarProduto($event)">
<!--Titulo-->
<input type="text" [formField]="produtoForm.titulo">

<!--Descrição-->
<input type="text" [formField]="produtoForm.descricao">

<!--Preço-->
<input type="number" inputmode="numeric" [formField]="produtoForm.preco">


<button>Cadastrar produto</button>

</form>
