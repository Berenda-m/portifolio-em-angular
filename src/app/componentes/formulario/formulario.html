
<h1>Teste de produtos</h1>
<form (submit)="cadastrarProduto($event)">
   <!--Titulo-->
   <input type="text" [formField]="produtoForm.titulo" placeholder="digite aqui">

   <!--Descrição-->
   <input type="text" [formField]="produtoForm.descricao" placeholder="digite aqui">

   <!--Preço-->
   <input type="number" inputmode="numeric" [formField]="produtoForm.preco" placeholder="digite aqui">


   <button>Cadastrar produto</button>


</form> 
@for (produto of produtos(); track $index) {
<div>
   <p>{{produto.titulo}}</p>
   <p>{{produto.descricao}}</p>
   <p>{{produto.preco}}</p>

</div>
}
