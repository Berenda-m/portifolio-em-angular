<h1>Exercicios Post 2</h1>

<form (submit)="cadastrarUsuario($event)">

<input type="text"  [formField]="postUsuarioForm.name"   placeholder="Nome">

<input type="text"  [formField]="postUsuarioForm.username"  placeholder="Username">

<input type="text" [formField]="postUsuarioForm.email" placeholder="Email">

<input type="number" [formField]="postUsuarioForm.phone" placeholder="Phone">

<button type="submit">Post</button>


</form>
